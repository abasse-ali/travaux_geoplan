# Le journal d'accès de nginx, sans les jetons des compagnons.
#
# Le jeton d'un lien est la seule clé du compagnon : qui le lit peut
# répondre à sa place pendant 60 jours. Il apparaît dans le chemin de
# l'API (/api/dispo/<jeton>) et dans l'adresse de la page
# (/dispo.html?t=<jeton>) ; on le remplace par « … » avant d'écrire. Le
# Referer n'est pas journalisé : quand la page appelle l'API, il porte
# l'adresse complète de la page, jeton compris.
# (Inclus dans le contexte http, comme tout fichier de conf.d.)

map $request_uri $chemin_sans_jeton {
  ~^(?<avant>/api/dispo/)[^/?#]+(?<apres>.*)$   "${avant}…${apres}";
  ~^(?<avant>/dispo\.html\?(?:.*&)?t=)[^&#]+(?<apres>.*)$   "${avant}…${apres}";
  default $request_uri;
}

log_format geoplan '$remote_addr [$time_local] "$request_method $chemin_sans_jeton $server_protocol" '
                   '$status $body_bytes_sent $request_time "$http_user_agent"';
access_log /var/log/nginx/access.log geoplan;
