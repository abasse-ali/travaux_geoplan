# En-têtes de sécurité, inclus dans CHAQUE location : nginx n'hérite
# pas des add_header du bloc server dès qu'une location en déclare un.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Les polices viennent de Google Fonts ; le temps réel passe par la même
# origine (ws: en local, wss: derrière TLS). Rien d'autre n'est chargé.
#
# connect-src nomme aussi les polices : le service worker reçoit cette
# politique avec son script (/sw.js), et c'est lui qui va les chercher
# (sa règle « polices », par fetch). Sans elles, dès la deuxième
# ouverture, l'application et la page du compagnon perdaient leurs
# polices (constat R2, relecture de la recette).
#
# Trois feuilles de style naissent dans la page, par le script : celle de
# vaul (la feuille du bas, W5 : son geste de fermeture tient à son
# touch-action), la même vide un instant avant d'être remplie, et celle
# qui bloque le défilement derrière une feuille ouverte (Radix), pour
# un écran sans barre de défilement visible (l'iPhone). Elles sont
# admises par leur empreinte, pas par 'unsafe-inline' ; une empreinte
# qui ne correspond plus (une montée de vaul) fait échouer le filet
# (e2e/csp.pwa.spec.ts, qui sert la construction sous cette même
# politique). Sans elles, la politique les refusait, et la feuille du bas
# ne se fermait plus d'un glisser (constat P7).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-YIjArHm2rkb5J7hX9lUM1bnQ3Kp61MTfluMGkuyKwDw=' 'sha256-nzTgYzXYDNe6BAHiiI7NNlfK8n/auuOAhh2t92YvuXo='; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss: https://fonts.googleapis.com https://fonts.gstatic.com; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# HSTS : une fois venu en https, le navigateur n'essaiera plus http. Sans
# effet sur une réponse http (essai local) : les navigateurs l'ignorent.
add_header Strict-Transport-Security "max-age=31536000" always;
