# En-têtes de sécurité, inclus dans CHAQUE location : nginx n'hérite
# pas des add_header du bloc server dès qu'une location en déclare un.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Les polices viennent de Google Fonts ; le temps réel passe par la même
# origine (ws: en local, wss: derrière TLS). Rien d'autre n'est chargé.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# HSTS : une fois venu en https, le navigateur n'essaiera plus http. Sans
# effet sur une réponse http (essai local) : les navigateurs l'ignorent.
add_header Strict-Transport-Security "max-age=31536000" always;
