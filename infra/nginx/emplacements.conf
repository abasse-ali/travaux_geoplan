# Les emplacements servis, communs au serveur http (geoplan.conf) et
# au serveur https de production (geoplan-tls.conf).

# L'adresse de l'API, relue au DNS de Docker toutes les 10 s au plus.
# Écrite en dur dans proxy_pass, nginx la résolvait une fois, au
# démarrage, et la gardait : l'API recréée à une autre adresse (un
# déploiement la recrée), toutes ses requêtes partaient vers l'ancienne
# (502) jusqu'au redémarrage de nginx ; arrêtée, elles attendaient une
# réponse de son adresse vide. Relue, elle suit l'API ; arrêtée, l'API n'a
# plus de nom, et nginx répond 502 tout de suite (constat R4, relecture
# de la recette ; P8 l'attribuait à tort au réseau de Docker).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
set $api http://api:3000;

# L'API. X-Real-IP et X-Forwarded-For portent l'adresse du client telle
# que nginx l'a calculée (adresse-client.conf) : X-Forwarded-For est
# REMPLACÉ, jamais complété, pour que rien de ce que le client y écrit
# n'atteigne la limitation de débit. L'API ne fait confiance qu'à nginx
# (TRUST_PROXY=1).
#
# proxy_connect_timeout : par défaut, nginx attend 60 s qu'une connexion
# à l'API s'établisse. L'API injoignable, la première requête pendait
# une minute avant son erreur : la page du compagnon restait sur
# « Chargement… », et l'application sur « … » (constat P8). Sur le réseau
# de Docker, l'API accepte une connexion en moins d'une milliseconde :
# au bout de 5 s, c'est qu'elle n'est pas là. Le délai de lecture, lui,
# ne change pas.
location /api/ {
  include /etc/nginx/snippets/securite.conf;
  add_header Cache-Control "no-store" always;
  proxy_pass $api;
  proxy_connect_timeout 5s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

# Le lien compagnon : même chose que /api/, mais nginx n'y écrit pas
# ses erreurs ordinaires. Son journal d'erreurs cite la requête
# complète, jeton compris, quand l'API ne répond pas ; l'API, elle,
# journalise l'incident sans le jeton.
location /api/dispo/ {
  include /etc/nginx/snippets/securite.conf;
  add_header Cache-Control "no-store" always;
  error_log /var/log/nginx/error.log crit;
  proxy_pass $api;
  proxy_connect_timeout 5s;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 30s;
}

# Le temps réel : une connexion qui dure, promue en WebSocket.
location /socket.io/ {
  proxy_pass $api;
  proxy_connect_timeout 5s;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 120s;
}

# Fichiers à empreinte : immuables, gardés un an.
location /assets/ {
  include /etc/nginx/snippets/securite.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# Le service worker doit être relu à chaque visite, sinon une mise à
# jour n'arriverait jamais sur l'iPhone.
location = /sw.js {
  include /etc/nginx/snippets/securite.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

# Deux vraies pages (index.html, dispo.html) : pas de repli vers
# index.html, sinon /dispo.html?t=… recevrait l'application.
location / {
  include /etc/nginx/snippets/securite.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri $uri/ =404;
}
