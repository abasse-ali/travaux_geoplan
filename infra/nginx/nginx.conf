# Configuration principale de nginx, à la place de celle de l'image.
#
# Celle de l'image déclare son propre journal d'accès au format
# « combined », qui écrit la requête complète — jetons des compagnons
# compris. Ici, le seul journal d'accès est celui de conf.d/journal.conf,
# qui les masque.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;
  include /etc/nginx/conf.d/*.conf;
}
