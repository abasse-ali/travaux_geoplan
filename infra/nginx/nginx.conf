# Configuration principale de nginx, à la place de celle de l'image.
#
# Celle de l'image déclare son propre journal d'accès au format
# « combined », qui écrit la requête complète — jetons des compagnons
# compris. Ici, le seul journal d'accès est celui de conf.d/journal.conf,
# qui les masque.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Les pages et les fichiers de l'application, compressés : sans cela,
  # nginx les servait tels quels, et dispo.html pesait 177 ko sur le fil
  # (le plafond du principe 7 est à 175), index.html 358 ko (constat R4,
  # relecture de la recette). Netlify les compressait. Le JSON de l'API
  # ne l'est pas : une réponse qui mêlerait une donnée secrète et ce que
  # l'appelant y fait écrire trahirait l'une par la taille de l'autre
  # (BREACH), et il pèse peu. text/html est toujours compressé.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript image/svg+xml;

  include /etc/nginx/conf.d/*.conf;
}
