# ============================================================
# nginx devant l'API et l'application
#
# Une seule origine pour tout : l'application, /api et /socket.io.
# C'est ce qui garde le cookie de session « premier parti » aux yeux
# de WebKit (ADR-002) : sur l'iPhone de Geoffrey, il n'expire pas au
# bout de 7 jours.
#
# Ce serveur écoute en http : essais locaux, et derrière Cloudflare le
# temps de poser le certificat. La production ajoute geoplan-tls.conf
# (voir infra/deploy/README.md, étape 3).
# ============================================================

server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 1m;
  root /usr/share/nginx/html;

  include /etc/nginx/snippets/emplacements.conf;
}
